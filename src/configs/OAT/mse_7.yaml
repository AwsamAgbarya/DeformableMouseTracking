# @package _global_

# Override Experiment settings
experiment:
  project: DeformableMouse
  name: SpatialTransformerMSE
  description: "Configuration Spatial transformer with a simple MSE loss"

model:
  encoder:
    embed_dim: 256
    depth: 16
    num_heads: 16
    mlp_ratio: 6
    qkv_bias: False
    drop_rate: 0.0
    attn_drop_rate: 0.0
    proj_dim: 1024
    enable_last_norm: True
  decoder:
    proj_dim: 1024
    decoder_num_heads: 8
    decoder_layers: 5
    decoder_dim_feedforward: 1024
    decoder_dropout: 0.0
    predict_depth: False
    use_depth_conditioning: False
    confidence: False

train_dataset:
  file_path: "./data/glob3DBodyParts.csv"
  norm_path: "./data/glob3DBodyParts_normalizer.npy"
  reference_parts: ["head center", "tail base"]
  n_rotations: 18
  train_ratio: 0.2

training:
  batch_size: 32
  num_workers: 4

  weight_decay: 1e-4
  learning_rate: 1e-4

  epochs: 200
  warmup_epochs: 10
  warmup_start_factor: 0.1
  min_learning_rate: 1e-7
  patience: 20

  grad_clip: 1.0
  log_interval: 150
  visualize_interval: 10
  device: 'cuda'
  checkpoint_interval: 30
  checkpoint_dir: './checkpoints/OAT/MSE_loss_7/'
  ema_decay: 0.99

  # Logging
  logging:
    use_wandb: true
    wandb_project: OATransformer
    wandb_entity: null
    run_name: "mse_loss_test_run_7"


loss:
  huber_delta: 0.01
  
  components:
    3d:
      enabled: true
      weight: 1.0
      warmup_epochs: 1

curriculum:
  masking_schedule:
    scheme: 'constant'
    start_ratio: 0.7
    end_ratio: 0.5
    total_epochs: 50
  
  loss_schedule:
    3d: 0

# Hydra configuration
hydra:
  run:
    dir: .
  job:
    chdir: false 
  