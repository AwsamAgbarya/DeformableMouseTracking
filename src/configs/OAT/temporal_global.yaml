# @package _global_
# Override Experiment settings
experiment:
  project: DeformableMouse
  name: TemporalBasic
  description: "Basic temporal model"

train_dataset:
  file_path: "../data/glob3DBodyParts.csv"
  # load_norm_path:
  # save_norm_path: 
  T_half: 30
  outlier_window: 1
  outlier_thresh: 90.0
  normalize: True
  validate: True
  max_radius: 96
  dropout_min: 0.1
  dropout_max: 0.3
  clean_frac: 0.15
  pattern_weights: { "isolated": 0.35, "burst": 0.30, "center": 0.35 }

validation_dataset:
  file_path: "../data/track_1_random_seed_change.csv"
  T_half: 30
  outlier_window: 1
  outlier_thresh: 90.0
  normalize: True
  validate: True
  max_radius: 96
  dropout_min: 0.1
  dropout_max: 0.3
  clean_frac: 0.15
  pattern_weights: { "isolated": 0.35, "burst": 0.30, "center": 0.35 }

masking:
  mask_strategy: 'temporal'
  mask_min: 0.3
  mask_max: 0.7
  warmup_epochs: 50
  n_control: 3
  mixing_ratio: 0.5

loss:
  use_uncertainty: true
  use_relative_dist: true
  main_loss_type: "l2"
  reldist_loss_type: "l1"
  lambda_main: 1.0
  lambda_uncertainty_reg: 1.0
  lambda_reldist: 0.5
  eps: 1e-6
  log_sigma_clamp: [-7.0, 7.0]

training:
  seed: 42
  epochs: 200
  batch_size: 32
  grad_clip_norm: 1.0
  log_interval: 50
  checkpoint_interval: 10
  visualize_interval: 10
  checkpoint_root: "../checkpoints/OAT/temporal_basic"
  run_name: null   # null -> auto timestamped
  use_wandb: true
  wandb_project: "mouse-temporal-transformer"
  resume_from: null
  dataloader:
    batch_size: 32
    num_workers: 1
  optimizer:
    lr: 3.0e-4
    weight_decay: 1.0e-2
    betas: [0.9, 0.999]
  scheduler:
    warmup_frac: 0.15
    min_lr_ratio: 0.05
  early_stopping:
    enabled: true
    patience: 30
    min_delta: 1.0e-4

model:
  embed_dim: 256
  depth: 8
  num_heads: 8
  mlp_ratio: 4.0
  qkv_bias: true
  qk_scale: null
  drop_rate: 0.1
  attn_drop_rate: 0.1
  predict_uncertainty: true
  predict_bond_aux: true
  bond_aux_dim: 3
  decoder_dim_feedforward: 1024
  decoder_dropout: 0.1
  enable_last_norm: true

# Hydra configuration
hydra:
  run:
    dir: .
  job:
    chdir: false 
